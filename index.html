<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Longevity Plate</title>
<meta name="description" content="Upload your blood work, photograph each meal, and get food advice tuned to your own markers, medications and tastes.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23EEF1EC' stroke='%2314261F' stroke-width='2'/%3E%3Ccircle cx='12' cy='13' r='3' fill='%232E6B4F'/%3E%3Ccircle cx='20' cy='14' r='2.5' fill='%23A3245A'/%3E%3Ccircle cx='15' cy='21' r='3' fill='%23B7791F'/%3E%3C/svg%3E">
<style>
:root{--bg:#EEF1EC;--surface:#FFFFFF;--ink:#14261F;--mute:#56645D;--line:#D5DCD5;--acc:#A3245A;--good:#2E6B4F;--goodbg:#DCEBE1;--warn:#B7791F;--warnbg:#F6EBD6;--bad:#A3245A;--badbg:#F5DDE6;--ease:cubic-bezier(0.22,1,0.36,1);--h1a:#000000;--h1b:#666666}
@media (prefers-color-scheme:dark){:root{--bg:#131209;--surface:#1F1F1F;--ink:#E9EEEA;--mute:#A3ADA7;--line:#313131;--acc:#E26A97;--good:#6CC197;--goodbg:#1E3328;--warn:#E3A84E;--warnbg:#33281B;--bad:#E26A97;--badbg:#3A1F2B;--h1a:#FFFFFF;--h1b:#9B9B9B}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Noto Sans SC","Noto Sans JP","Noto Sans KR","Noto Sans Arabic","Noto Sans Devanagari",system-ui,sans-serif;font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{text-wrap:pretty}
h1,h2{text-wrap:balance}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{left:8px}
[hidden]{display:none!important}

/* nav */
.nav{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:16px;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);max-width:calc(100% - 24px)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap;color:var(--ink);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.brand svg{width:24px;height:24px;flex:none}
.langsel{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;line-height:20px;padding:8px 12px;border-radius:8px;max-width:150px;cursor:pointer}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer;transition:transform .3s var(--ease),background-color .3s var(--ease),opacity .3s var(--ease);text-decoration:none}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.lg{font-size:16px;line-height:24px;padding:12px 24px;border-radius:12px}
.btn.full{width:100%;padding:12px 16px;font-size:16px;line-height:24px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.ghost{border-color:transparent;background:none;color:var(--mute)}
.btn.sm{padding:4px 8px;font-size:12px;line-height:16px}

/* landing */
.land section{padding:96px 24px}
.wrap{max-width:1120px;margin:0 auto}
.hero{min-height:100svh;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;max-width:1120px;margin:0 auto;padding:120px 24px 64px}
.hero h1{font-size:60px;line-height:1;font-weight:700;letter-spacing:-0.02em;margin:0 0 24px;max-width:680px;background:linear-gradient(90deg,var(--h1a),var(--h1b));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:pre-line}
.hero p.sub{font-size:18px;line-height:28px;color:var(--mute);max-width:680px;margin:0 0 32px}
.proof{display:flex;flex-wrap:wrap;gap:16px;margin-top:24px;font-size:14px;line-height:20px;color:var(--mute)}
.proof span{display:inline-flex;align-items:center;gap:8px}
.proof svg{width:16px;height:16px;flex:none}
.plate{position:relative;aspect-ratio:1;width:100%;max-width:520px;justify-self:center}
.plate canvas{width:100%;height:100%;display:block}
.tagline{max-width:880px;margin:0 auto}
.tagline p{font-size:48px;line-height:1.1;font-weight:600;letter-spacing:-0.01em;margin:0;text-wrap:balance}
.tagline .w{opacity:.28;transition:opacity .6s var(--ease),color .6s var(--ease)}
.tagline .w.on{opacity:1}
.tagline .w.key.on{color:var(--acc)}
.sec-h{font-size:36px;line-height:40px;font-weight:700;letter-spacing:-0.01em;margin:0 0 48px;max-width:680px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;counter-reset:s}
.step{border-top:2px solid var(--ink);padding-top:24px}
.step .n{font-size:14px;line-height:20px;font-weight:600;color:var(--acc);margin-bottom:12px}
.step h3,.ben h3{font-size:20px;line-height:28px;margin:0 0 8px}
.step p,.ben p{margin:0;color:var(--mute)}
.bens{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.ben{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px;position:relative;overflow:hidden}
.ben .dot{width:12px;height:12px;border-radius:50%;margin-bottom:16px}
.research{background:var(--ink);color:var(--bg);border-radius:24px;padding:64px;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.research h2{font-size:36px;line-height:40px;margin:0;color:var(--bg)}
.research p{margin:0;font-size:18px;line-height:28px;opacity:.85}
.faq{max-width:760px;margin:0 auto}
.faq details{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
.faq summary{list-style:none;cursor:pointer;padding:16px 24px;font-weight:600;font-size:18px;line-height:28px;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .pm{transition:transform .5s var(--ease);flex:none}
.faq details[open] summary .pm{transform:rotate(45deg)}
.faq details p{margin:0;padding:0 24px 24px;color:var(--mute)}
.final{text-align:center}
.final h2{font-size:48px;line-height:1;margin:0 auto 16px;max-width:680px;letter-spacing:-0.02em}
.final p{color:var(--mute);margin:0 0 32px;font-size:18px;line-height:28px}
footer.lf{padding:32px 24px 48px;text-align:center;font-size:14px;line-height:20px;color:var(--mute);border-top:1px solid var(--line)}
footer.lf .links{display:flex;gap:16px;justify-content:center;margin-top:8px;flex-wrap:wrap}
footer.lf button{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:14px}
.reveal{opacity:0;transform:translateY(32px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (max-width:860px){
 .hero{grid-template-columns:1fr;gap:32px;padding-top:104px;min-height:auto}
 .hero h1{font-size:36px;line-height:40px}
 .plate{max-width:360px}
 .tagline p{font-size:30px;line-height:36px}
 .steps,.bens{grid-template-columns:1fr}
 .research{grid-template-columns:1fr;padding:32px;gap:24px}
 .research h2,.sec-h{font-size:30px;line-height:36px}
 .final h2{font-size:36px;line-height:40px}
 .land section{padding:64px 16px}
 .nav .brand span{display:none}
 .nav{gap:8px;padding:8px}
 .langsel{max-width:120px}
}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.tagline .w{opacity:1;transition:none}html{scroll-behavior:auto}}

/* app */
.app{max-width:640px;margin:0 auto;padding:88px 16px 112px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:8px;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font-size:14px;line-height:20px;font-weight:600;padding:8px 4px;border-radius:8px;cursor:pointer;transition:background-color .3s var(--ease)}
.tabs button.on{color:var(--ink);background:var(--bg)}
.tabs button.primary{background:var(--acc);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{font-size:18px;line-height:28px;margin:0 0 8px}
h3.sub{font-size:14px;line-height:20px;margin:16px 0 4px;color:var(--mute);font-weight:600}
.mute{color:var(--mute);font-size:14px;line-height:20px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}
input,select,textarea{width:100%;font-size:16px;line-height:24px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-size:14px;line-height:20px;color:var(--mute);margin:12px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;line-height:20px;padding:4px 12px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.bar{margin:8px 0}
.bar .lab{display:flex;justify-content:space-between;font-size:14px;line-height:20px}
.bar .track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.bar .fill{height:100%;background:var(--good);border-radius:4px;transform-origin:left;transition:transform .5s var(--ease)}
[dir=rtl] .bar .fill{transform-origin:right}
.bar .fill.over{background:var(--bad)}.bar .fill.near{background:var(--warn)}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:28px;border-radius:8px;font-weight:700;font-size:14px;padding:0 8px}
.s-good{background:var(--goodbg);color:var(--good)}.s-mid{background:var(--warnbg);color:var(--warn)}.s-bad{background:var(--badbg);color:var(--bad)}
.meal{display:flex;gap:12px}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:var(--bg)}
.meal .body{flex:1;min-width:0}
ul.tight{margin:4px 0;padding-inline-start:20px}ul.tight li{margin:2px 0}
.pill{display:inline-block;font-size:12px;line-height:16px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mute)}
.callout{background:var(--warnbg);border-radius:16px;padding:12px 16px;margin-bottom:12px;font-size:14px;line-height:20px}
.callout.info{background:var(--goodbg)}
.err{color:var(--bad);font-size:14px;line-height:20px;margin-top:8px}
.previews{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.previews .p{position:relative}
.previews img{width:80px;height:80px;object-fit:cover;border-radius:8px}
.addtile{width:80px;height:80px;border-radius:8px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:28px;color:var(--mute);cursor:pointer}.addtile span{font-size:12px;line-height:16px}
.previews .x{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}
th,td{text-align:start;padding:4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600}td.n{text-align:end;white-space:nowrap}
.labrow{display:grid;grid-template-columns:1.6fr 1fr .8fr 1.2fr 1fr 24px;gap:4px;margin-bottom:4px}
.labrow input,.labrow select{padding:4px 8px;font-size:14px;line-height:20px}
.hi{color:var(--bad);font-weight:600}.lo{color:var(--warn);font-weight:600}
.skel{height:16px;border-radius:4px;background:var(--line);margin:8px 0;animation:pulse 1.4s var(--ease) infinite}
@keyframes pulse{50%{opacity:.5}}
details.d summary{cursor:pointer;color:var(--good);font-size:14px;line-height:20px;margin-top:8px;font-weight:600}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.daynav .d{font-weight:700;font-size:18px;line-height:28px}
.hist{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;color:inherit;text-align:start;font:inherit}
.hist:last-child{border-bottom:0}
.sticky-save{position:sticky;bottom:80px;z-index:4}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px}
.sw{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none;transition:background-color .3s var(--ease)}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .5s var(--ease)}
.sw.on{background:var(--good)}.sw.on::after{transform:translateX(20px)}
.cmp{position:relative;height:24px;margin:8px 0 4px}
.cmp .rng{position:absolute;top:8px;height:8px;border-radius:4px;background:var(--line)}
.cmp .med{position:absolute;top:4px;width:2px;height:16px;background:var(--mute)}
.cmp .you{position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:var(--acc);border:2px solid var(--surface);margin-left:-10px}
.foot{font-size:12px;line-height:16px;color:var(--mute);text-align:center;margin-top:24px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:30}
</style>
</head>

const DICT_VER=(()=>{let h=0;const s=JSON.stringify(EN);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 'v'+(h>>>0).toString(36)})();
const I={lang:'en',dict:EN,busy:false,msg:''};
function t(k,v){let s=(I.dict&&I.dict[k])??EN[k]??k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function pickInitialLang(){const saved=lsGet('lp_lang');if(saved&&LANGNAME[saved])return saved;const n=(navigator.language||'en');if(/^zh-(TW|HK|MO)|Hant/i.test(n))return 'zh-TW';if(/^zh/i.test(n))return 'zh-CN';const b=n.split('-')[0];return LANGS.find(l=>l[0]===b)?.[0]||'en'}
async function setLang(code,persist=true){
  I.lang=code;if(persist)lsSet('lp_lang',code);
  document.documentElement.lang=code;document.documentElement.dir=code==='ar'?'rtl':'ltr';
  if(code==='en'){I.dict=EN}else if(code==='zh-CN'){I.dict=ZH}
  else{
    let d=null;try{const c=JSON.parse(lsGet('lp_dict_'+code)||'null');if(c&&c.ver===DICT_VER)d=c.dict}catch(e){}
    if(!d&&S.db){try{const s=await S.db.doc('i18n/'+code).get();const x=s.exists&&s.data();if(x&&x.ver===DICT_VER&&x.dict)d=sanitizeDict(x.dict)}catch(e){}}
    if(d){I.dict=d}
    else{I.dict=EN;translateDict(code)}
  }
  paintChrome();render();
}
function sanitizeDict(d){const o={};for(const k in EN){const v=d&&d[k];o[k]=(typeof v==='string'&&v.length<800)?v.replace(/[<>]/g,'').replace(/"/g,'\u201D'):EN[k]}return o}
async function translateDict(code){
  if(!S.sample){I.msg=S.ready?t('translate_need'):'';paintChrome();return}
  if(I.busy)return;I.busy=true;I.msg=EN.translating;paintChrome();
  try{
    const keys=Object.keys(EN).filter(k=>k!=='tag_keys');const chunks=[];for(let i=0;i<keys.length;i+=70)chunks.push(keys.slice(i,i+70));
    const parts=await Promise.all(chunks.map(ks=>{const src={};ks.forEach(k=>src[k]=EN[k]);
      return S.sample(`Translate the JSON values below from English into ${LANGNAME[code]} for a consumer nutrition app. Keep every key unchanged. Keep placeholders like {n} exactly. Keep "\\n" line breaks. Use natural, plain, friendly wording. Do not use hyphens inside sentences. Return only the JSON object.\n${JSON.stringify(src)}`,{modelTier:'default'}).then(r=>parseJSON(r.text))}));
    const merged=Object.assign({},...parts);
    // key phrase for the tagline highlight
    merged.tag_keys='';
    const dict=sanitizeDict(merged);dict.tag_keys='';
    lsSet('lp_dict_'+code,JSON.stringify({ver:DICT_VER,dict}));
    if(S.db){S.db.doc('i18n/'+code).set({ver:DICT_VER,dict,at:Date.now()}).catch(()=>{})}
    if(I.lang===code)I.dict=dict;I.msg='';
  }catch(e){I.msg=EN.translate_fail}
  I.busy=false;paintChrome();render();
}

function sortPts(l){l.points=(l.points||[]).filter(Boolean).sort((a,b)=>String(a.date).localeCompare(String(b.date)));const last=l.points[l.points.length-1];if(last){l.value=last.value;l.unit=last.unit;l.ref=last.ref;l.flag=last.flag;l.date=last.date}return l}
function withPoints(l){l=Object.assign({},l);if(!l.points||!l.points.length)l.points=[{date:l.date||'',value:String(l.value??''),unit:l.unit||'',ref:l.ref||'',flag:norm(l.flag||''),rid:l.rid||'legacy'}];return l}
function syncLatest(p){(p.labs||[]).forEach(l=>{if(!l.points||!l.points.length){Object.assign(l,withPoints(l));return}const last=l.points[l.points.length-1];last.value=String(l.value??'');last.unit=l.unit||'';last.ref=l.ref||'';last.flag=l.flag||''});return p}
function labsWithHistory(){return (S.profile?.labs||[]).filter(l=>(l.points||[]).filter(x=>x.value!=='').length>1)}
function makePf(){const p=clone(S.profile)||{};p.basics=p.basics||{};p.basics.sex=norm(p.basics.sex||'');p.basics.activity=norm(p.basics.activity||'');p.labs=(p.labs||[]).map(l=>withPoints(Object.assign({},l,{flag:norm(l.flag||'')})));p.labs.forEach(l=>l.points.forEach(x=>x.flag=norm(x.flag||'')));p.reports=p.reports||[];
  const leg=p.labs.flatMap(l=>l.points.filter(x=>x.rid==='legacy'));if(leg.length&&!p.reports.some(r=>r.id==='legacy')){const cnt={};leg.forEach(x=>cnt[x.date]=(cnt[x.date]||0)+1);p.reports.unshift({id:'legacy',date:Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0]||'',count:leg.length,at:0})}
  return p}

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error(t('err_img')));i.src=u})}
async function compress(file,max,q){const img=await loadImg(file);const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',q))}
async function thumbnail(file){const img=await loadImg(file);const Z=220;const s=Math.max(Z/img.naturalWidth,Z/img.naturalHeight);const c=document.createElement('canvas');c.width=Z;c.height=Z;const w=img.naturalWidth*s,h=img.naturalHeight*s;c.getContext('2d').drawImage(img,(Z-w)/2,(Z-h)/2,w,h);return c.toDataURL('image/jpeg',.6)}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function loadPdf(file){
  if(!window.pdfjsLib){await loadScript(PDFJS+'pdf.worker.min.js');await loadScript(PDFJS+'pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'}
  return pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise}
async function pdfText(pdf,maxPages){const out=[];for(let i=1;i<=Math.min(pdf.numPages,maxPages);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();
  // rebuild lines from text positions so table rows stay together
  const rows={};tc.items.forEach(it=>{const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push([it.transform[4],it.str])});
  out.push(Object.keys(rows).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean).join('\n'))}
  return out}
async function pdfImages(pdf,maxPages){const out=[];for(let i=1;i<=Math.min(pdf.numPages,maxPages);i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:1.6});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.85)))}
  return out}

async function analyzeMeal(){

    if(!d.blobs){d.blobs=await Promise.all(d.files.slice(0,MAX_PHOTOS).map(f=>compress(f,1280,.82)));d.seen=null}
    const per=S.maxImg||4;let seenTxt='';
    if(d.blobs.length>per){
      // too many photos for one request: identify foods batch by batch, then combine in one text-only pass
      if(!d.seen){const seen=[];
        for(let i=0;i<d.blobs.length;i+=per){const a=i+1,b=Math.min(i+per,d.blobs.length);d.progress=t('analyzing_p',{a,b,n:d.blobs.length});render();
          const r=await S.sample(`These are photos ${a} to ${b} of ${d.blobs.length} from ONE meal. List every food and drink visible with an estimated portion and nutrients. User notes: ${d.note||'(none)'}. Return only JSON {"items":[{"name":"","portion":"","photos":"which photo numbers","kcal":0,"protein_g":0,"carbs_g":0,"fiber_g":0,"sat_fat_g":0,"sugar_g":0,"sodium_mg":0}]}`,{images:d.blobs.slice(i,i+per),modelTier:'default'});
          seen.push({photos:`${a}-${b}`,items:parseJSON(r.text).items||[]})}
        d.seen=seen}
      d.progress=t('analyzing');render();
      seenTxt=`The meal was photographed in ${d.blobs.length} photos, examined in batches. Foods found per batch (the same dish may appear in several photos or batches; merge duplicates so nothing is counted twice, and keep separate servings separate only when clearly different): ${JSON.stringify(d.seen)}`;
    }
    const before=sumMeals(S.days[d.date]?.meals);
    const prompt=`You are a registered dietitian focused on longevity and chronic disease prevention. From the photos (if any) and the description, identify the foods in this meal, estimate portions and nutrients, and judge the meal against this person's own health profile.
${SAFETY}
Judge by evidence on healthy longevity (vegetables, legumes, whole grains, nuts, fish, olive oil; limit processed meat, ultra processed food, added sugar, refined carbs, excess sodium and saturated fat, alcohol; enough protein and fiber), weighted toward this person's own markers and problems.
Profile: ${JSON.stringify(profileForAI())}
Already eaten today before this meal: ${JSON.stringify(before)}. Daily targets: ${JSON.stringify(targets())}
Meal: ${d.type}. User notes: ${d.note||'(none)'}
${seenTxt}
${d.result?`Your previous analysis: ${JSON.stringify(d.result)}\nUser correction: ${d.correction}\nRedo the analysis with the correction.`:''}
${OUT()} Return only JSON:
{"items":[{"name":"","portion":"e.g. 1 bowl, about 150 g","kcal":0,"protein_g":0,"carbs_g":0,"fiber_g":0,"sat_fat_g":0,"sugar_g":0,"sodium_mg":0}],"totals":{"kcal":0,"protein_g":0,"carbs_g":0,"fiber_g":0,"sat_fat_g":0,"sugar_g":0,"sodium_mg":0},"score":0,"verdict":"one line","good":[""],"concerns":["tied to this person's markers, with the reason"],"swaps":["specific swaps"],"next_meal":"","confidence":"high|medium|low","questions":["only if unsure"]}
score is an integer 0 to 100.`;
    const opts={modelTier:'default'};if(d.blobs.length&&!seenTxt)opts.images=d.blobs;
    const r=await S.sample(prompt,opts);d.result=parseJSON(r.text);d.correction='';
  }catch(e){d.err=errMsg(e)}
  d.busy=false;d.progress='';render();
}

const LAB_SCHEMA=`Return only JSON: {"date":"report date YYYY-MM-DD or empty","labs":[{"name":"name as printed on the report","name_en":"standard English name","code":"standard uppercase code such as LDL_C, HDL_C, TG, TC, HBA1C, FPG, URIC_ACID, ALT, AST, GGT, CREATININE, EGFR, TSH, VIT_D, FERRITIN, HGB, WBC, PLT, CRP, PSA","value":"number as printed","unit":"","ref":"reference range","flag":"high|low|normal"}]}. Copy values exactly. Do not invent anything; skip values you cannot read. If this part has no lab results, return an empty labs array.`;
async function extractLabs(files){
  if(!S.sample){S.labMsg=t('no_report_ai');render();return}
  S.labBusy=true;S.labMsg=t('reading');render();
  try{
    const texts=[],images=[];
    for(const f of files){
      if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
        let pdf;try{pdf=await loadPdf(f)}catch(e){throw new Error(t('pdf_fail'))}
        const pages=await pdfText(pdf,40);
        // pages with real text are read as text (no image limit); scanned pages fall back to images
        const scanned=[];pages.forEach((p,i)=>{if(p.length>=40)texts.push(`--- ${f.name} page ${i+1} ---\n${p}`);else scanned.push(i+1)});
        if(scanned.length){const imgs=await pdfImages(pdf,40);scanned.forEach(n=>imgs[n-1]&&images.push(imgs[n-1]))}
      }else images.push(await compress(f,1600,.82));
    }
    if(images.length&&!S.canImg)throw new Error(t('no_report_ai'));
    // build jobs: text in chunks of ~24k characters, images in groups the model accepts
    const jobs=[];let buf='';
    texts.forEach(p=>{if(buf.length+p.length>24000&&buf){jobs.push({text:buf});buf=''}buf+=p+'\n'});if(buf)jobs.push({text:buf});
    const per=S.maxImg||4;for(let i=0;i<images.length;i+=per)jobs.push({images:images.slice(i,i+per)});
    let date='',all=[];
    for(let j=0;j<jobs.length;j++){
      S.labMsg=t('reading_p',{a:j+1,n:jobs.length});render();
      const job=jobs[j];
      const r=job.text?await S.sample(`Extract every lab test result from this health report text (extracted from a PDF; table columns may be run together on one line). ${LAB_SCHEMA}\n\n${job.text}`,{modelTier:'default'})
                      :await S.sample(`Extract every lab test result from these health report images. ${LAB_SCHEMA}`,{images:job.images,modelTier:'default'});
      const out=parseJSON(r.text);if(!date&&out.date)date=out.date;all=all.concat(out.labs||[]);
    }
    date=date||todayKey();
    date=/^\d{4}-\d{2}-\d{2}$/.test(date)?date:todayKey();
    const rid='r'+Date.now();const labs=(S.pf.labs||[]).map(withPoints);let grew=false;
    all.forEach(l=>{if(!l.name)return;const code=String(l.code||'').toUpperCase().replace(/[^A-Z0-9_]/g,'');
      const i=labs.findIndex(x=>(code&&x.code===code)||String(x.name).toLowerCase()===String(l.name).toLowerCase()||(l.name_en&&String(x.name_en||'').toLowerCase()===String(l.name_en).toLowerCase()));
      const pt={date,value:String(l.value??''),unit:l.unit||'',ref:l.ref||'',flag:['high','low','normal'].includes(l.flag)?l.flag:'',rid};
      if(i>=0){const x=labs[i];x.points=x.points.filter(q=>q.date!==date);x.points.push(pt);if(!x.code&&code)x.code=code;if(!x.name_en&&l.name_en)x.name_en=l.name_en;sortPts(x);if(x.points.length>1)grew=true}
      else labs.push(sortPts({name:l.name,name_en:l.name_en||'',code,points:[pt]}))});
    S.pf.labs=labs;S.pf.reports=(S.pf.reports||[]).concat([{id:rid,date,count:all.length,at:Date.now()}]);
    if(S.pf.trend)S.pf.trend.stale=true;
    S.labMsg=t('labs_read',{n:all.length,d:date});S.pfDirty=true;
    await saveProfile(true);
    if(grew&&S.sample){S.labBusy=false;await analyzeTrend()}
  }catch(e){S.labMsg=errMsg(e)}
  S.labBusy=false;render();
}
function dietAverages(){const ks=Object.keys(S.days).sort().reverse().slice(0,60);const days=ks.map(k=>S.days[k]).filter(d=>(d.meals||[]).length);if(!days.length)return null;const tot={};NUTS.forEach(n=>tot[n.k]=0);days.forEach(d=>{const x=sumMeals(d.meals);NUTS.forEach(n=>tot[n.k]+=x[n.k])});NUTS.forEach(n=>tot[n.k]=Math.round(tot[n.k]/days.length));
  const foods={};days.forEach(d=>d.meals.forEach(m=>(m.a?.items||[]).forEach(i=>foods[i.name]=(foods[i.name]||0)+1)));return{logged_days:days.length,avg_daily:tot,frequent_foods:Object.entries(foods).sort((a,b)=>b[1]-a[1]).slice(0,25).map(x=>x[0])}}

async function ensureCodes(p){
  const missing=(p.labs||[]).filter(l=>l.name&&!l.code);
  if(!missing.length||!S.sample)return p;
  try{const r=await S.sample(`For each lab test name, give a standard English name and a standard uppercase code (examples: LDL_C, HDL_C, TG, TC, HBA1C, FPG, URIC_ACID, ALT, AST, CREATININE, EGFR, TSH, VIT_D, HGB, CRP). Return only JSON {"rows":[{"name":"","name_en":"","code":""}]} in the same order.\n${JSON.stringify(missing.map(l=>l.name))}`,{modelTier:'quick'});
    const rows=parseJSON(r.text).rows||[];missing.forEach((l,i)=>{const x=rows[i];if(x){l.code=String(x.code||'').toUpperCase().replace(/[^A-Z0-9_]/g,'');l.name_en=x.name_en||''}});}catch(e){}
  return p}
async function syncResearch(p){
  const labs=(p.labs||[]).filter(l=>l.code&&isFinite(parseFloat(l.value))).map(l=>({code:l.code,name_en:l.name_en||'',value:parseFloat(l.value),unit:String(l.unit||'').trim(),flag:norm(l.flag)||''}));
  await writeDoc(resRef(),{sex:p.basics?.sex||'',age_band:ageBandFrom(p),labs,updatedAt:Date.now()});
}
function ageBandFrom(p){const y=num(p.basics?.birth_year);if(!y)return '';const a=new Date().getFullYear()-y;const b=Math.floor(a/5)*5;return `${b}-${b+4}`}
async function toggleShare(){
  if(S.shareBusy)return;S.shareBusy=true;S.shareMsg=t('share_saving');render();
  try{
    let p=clone(S.pf);const on=!p.share;p.share=on;
    if(on){p=await ensureCodes(p)}
    p.updatedAt=Date.now();await writeProfile(p);S.pf=p;S.pfDirty=false;
    if(on){await syncResearch(p);S.shareMsg=t('share_on_msg')}else{await resRef().delete();S.shareMsg=t('share_off_msg')}
  }catch(e){S.shareMsg=errMsg(e)}
  S.shareBusy=false;render();
}
function quant(a,q){const s=[...a].sort((x,y)=>x-y);const pos=(s.length-1)*q;const lo=Math.floor(pos),hi=Math.ceil(pos);return s[lo]+(s[hi]-s[lo])*(pos-lo)}
async function refreshInsights(){
  S.insBusy=true;S.insMsg='';render();
  try{
    const q=await S.db.collection('research').limit(1000).get();const rows=q.docs.map(d=>d.data());S.rowCount=rows.length;
    const M={};
    rows.forEach(r=>(r.labs||[]).forEach(l=>{if(!l.code)return;(M[l.code]=M[l.code]||{code:l.code,names:{},units:{},vals:[]});const m=M[l.code];if(l.name_en)m.names[l.name_en]=(m.names[l.name_en]||0)+1;m.units[l.unit]=(m.units[l.unit]||0)+1;m.vals.push({v:l.value,u:l.unit,f:l.flag,band:r.age_band})}));
    const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0]?.[0]||'';
    const markers=[];
    if(rows.length>=K_MIN){
      Object.values(M).forEach(m=>{const unit=top(m.units);const vs=m.vals.filter(x=>x.u===unit&&isFinite(x.v));if(vs.length<K_MIN)return;
        const v=vs.map(x=>x.v);const pct=f=>Math.round(100*vs.filter(x=>x.f===f).length/vs.length);
        const bands={};vs.forEach(x=>{if(!x.band)return;(bands[x.band]=bands[x.band]||[]).push(x)});
        const byAge=Object.entries(bands).filter(([b,a])=>a.length>=K_MIN).sort().map(([b,a])=>({band:b,n:a.length,median:+quant(a.map(x=>x.v),.5).toFixed(2),pctHigh:Math.round(100*a.filter(x=>x.f==='high').length/a.length),pctLow:Math.round(100*a.filter(x=>x.f==='low').length/a.length)}));
        markers.push({code:m.code,name:top(m.names)||m.code,unit,n:vs.length,median:+quant(v,.5).toFixed(2),p25:+quant(v,.25).toFixed(2),p75:+quant(v,.75).toFixed(2),min:+quant(v,.05).toFixed(2),max:+quant(v,.95).toFixed(2),pctHigh:pct('high'),pctLow:pct('low'),byAge})});
      markers.sort((a,b)=>(b.pctHigh+b.pctLow)-(a.pctHigh+a.pctLow)||b.n-a.n);
    }
    const prev=S.insights||{};
    await writeDoc(insRef(),{contributors:rows.length>=K_MIN?rows.length:0,markers,brief:prev.brief||'',briefAt:prev.briefAt||0,updatedAt:Date.now()});
  }catch(e){S.insMsg=errMsg(e)}
  S.insBusy=false;render();
}
async function writeBrief(){
  if(!S.sample||!S.insights?.markers?.length)return;S.insBusy=true;render();
  try{const r=await S.sample(`You are a nutrition epidemiologist. Here are anonymized aggregate lab statistics from users of a longevity diet app (groups under 5 suppressed). Write a short research brief: the most common out of range markers, age patterns, likely dietary levers, and caveats about this self selected sample. Plain text, under 250 words. ${OUT()}\n${JSON.stringify(S.insights.markers.slice(0,40))}`,{modelTier:'complex'});
    const s=clone(S.insights);s.brief=r.text.trim();s.briefAt=Date.now();await writeDoc(insRef(),s)}catch(e){S.insMsg=errMsg(e)}
  S.insBusy=false;render();
}

function bars(tot,tg){return NUTS.map(n=>{const v=tot[n.k]||0,g=tg[n.k]||1,p=v/g;let cls='';if(n.type==='limit')cls=p>1?'over':p>.85?'near':'';return `<div class="bar"><div class="lab"><span>${esc(t(n.l))}</span><span class="${n.type==='limit'&&p>1?'hi':''}">${Math.round(v)} / ${Math.round(g)} ${n.u}</span></div><div class="track"><div class="fill ${cls}" style="transform:scaleX(${Math.min(1,p).toFixed(3)})"></div></div></div>`}).join('')}
function list(arr){return arr&&arr.length?`<ul class="tight">${arr.map(x=>`<li>${esc(typeof x==='string'?x:(x.food||x.title||x.name)+((x.why||x.note)?': '+(x.why||x.note):''))}</li>`).join('')}</ul>`:''}
function analysisDetail(a){
  return `${a.good?.length?`<h3 class="sub">${t('good')}</h3>${list(a.good)}`:''}${a.concerns?.length?`<h3 class="sub">${t('concerns')}</h3>${list(a.concerns)}`:''}${a.swaps?.length?`<h3 class="sub">${t('swaps')}</h3>${list(a.swaps)}`:''}${a.next_meal?`<h3 class="sub">${t('next_meal')}</h3><div>${esc(a.next_meal)}</div>`:''}
  <h3 class="sub">${t('foods')} <span class="pill">${t('confidence')}: ${esc(a.confidence||'—')}</span></h3>
  <table><tr><th>${t('food')}</th><th class="n">kcal</th><th class="n">${t('protein_s')}</th><th class="n">${t('fiber_s')}</th><th class="n">${t('sodium_s')}</th></tr>${(a.items||[]).map(i=>`<tr><td>${esc(i.name)}<div class="mute">${esc(i.portion)}</div></td><td class="n">${Math.round(num(i.kcal))}</td><td class="n">${Math.round(num(i.protein_g))}g</td><td class="n">${Math.round(num(i.fiber_g))}g</td><td class="n">${Math.round(num(i.sodium_mg))}mg</td></tr>`).join('')}</table>`}
function skeleton(){return `<div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div>`}

  if(reduce)ws.forEach(w=>w.classList.add('on'));
  else{let raf=0;const upd=()=>{raf=0;const line=innerHeight*0.62;ws.forEach(w=>{if(!w.classList.contains('on')&&w.getBoundingClientRect().top<line)w.classList.add('on')})};

function startPlate(reduce){

    for(let i=0;i<N;i++){const s=segs[i%4<2?0:i%4===2?(Math.random()<.5?1:2):3];const a=s.a0+Math.random()*(s.a1-s.a0);const rr=R*0.84*Math.sqrt(Math.random());

  if(S.stale)h+=`<div class="mute" style="margin-bottom:8px">${t('stale')}</div>`;
  if(!S.loaded)h+=skeleton()+skeleton();
  else if(S.db)h+=S.tab==='today'?viewToday():S.tab==='log'?viewLog():S.tab==='profile'?viewProfile():viewInsights();
  h+=`<div class="foot">${t('disclaimer')}</div></div>`;
  $('#main').innerHTML=h;
}

/* ================= events ================= */
addEventListener('hashchange',route);
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.pending)render()},0));
$('#langsel').addEventListener('change',e=>{setLang(e.target.value);if(S.db&&S.profile){const p=clone(S.profile);p.lang=e.target.value;writeProfile(p).catch(()=>{})}});
$('#navcta').addEventListener('click',()=>{location.hash=S.view==='app'?'home':'app'});
$('#brandbtn').addEventListener('click',()=>{location.hash='home'});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;if(S.tab==='profile'&&!S.pfDirty)S.pf=makePf();S.saveMsg='';S.shareMsg='';render(true);scrollTo(0,0)});
$('#main').addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=S.draft;
  if(a!=='del')S.delArm=null;if(a!=='import')S.importArm=false;if(a!=='rmreport')S.rmArm=null;
  if(a==='prev'){S.viewKey=shiftKey(S.viewKey,-1);render()}
  else if(a==='next'){if(S.viewKey<todayKey())S.viewKey=shiftKey(S.viewKey,1);render()}
  else if(a==='del')deleteMeal(S.viewKey,b.dataset.id);
  else if(a==='review')reviewDay();
  else if(a==='type'){d.type=b.dataset.v;render()}
  else if(a==='rmimg'){const i=+b.dataset.i;URL.revokeObjectURL(d.urls[i]);d.files.splice(i,1);d.urls.splice(i,1);d.blobs=null;d.seen=null;d.result=null;render()}
  else if(a==='analyze'){d.result=null;analyzeMeal()}
  else if(a==='reanalyze'){if(!d.correction.trim()){d.err=t('err_need_corr');render();return}analyzeMeal()}
  else if(a==='savemeal')saveMeal();
  else if(a==='discard'){d.urls.forEach(u=>URL.revokeObjectURL(u));S.draft=newDraft();render()}
  else if(a==='saveprof')saveProfile();
  else if(a==='addlab'){S.pf.labs.push({name:'',value:'',unit:'',ref:'',flag:'',date:todayKey()});S.pfDirty=true;render()}
  else if(a==='rmreport')removeReport(b.dataset.id);
  else if(a==='trend')analyzeTrend();
  else if(a==='rmlab'){S.pf.labs.splice(+b.dataset.i,1);S.pfDirty=true;render()}
  else if(a==='plan')makePlan();
  else if(a==='share')toggleShare();
  else if(a==='insrefresh')refreshInsights();
  else if(a==='insbrief')writeBrief();
  else if(a==='openday'){S.viewKey=b.dataset.k;render();scrollTo(0,0)}
  else if(a==='toprivacy'){const el=$('#privacy');if(el){el.open=true;el.scrollIntoView({behavior:'smooth',block:'center'})}}
  else if(a==='totop')scrollTo({top:0,behavior:'smooth'});
  else if(a==='login')doLogin();
  else if(a==='export')doExport();
  else if(a==='import')doImport();
  else if(a==='signout')window.LP_SB.auth.signOut();
});
$('#main').addEventListener('input',e=>{
  const x=e.target,d=S.draft;
  if(x.id==='d-note')d.note=x.value;
  else if(x.id==='login-email')S.loginEmail=x.value;
  else if(x.id==='import-box')S.importText=x.value;
  else if(x.id==='d-corr')d.correction=x.value;
  else if(x.dataset.pb!=null){S.pf.basics[x.dataset.pb]=x.value;S.pfDirty=true}
  else if(x.dataset.pt!=null){S.pf[x.dataset.pt]=x.value;S.pfDirty=true}
  else if(x.dataset.lab!=null){S.pf.labs[+x.dataset.lab][x.dataset.f]=x.value;S.pfDirty=true}
});
$('#main').addEventListener('change',e=>{
  const x=e.target,d=S.draft;
  if(x.id==='mealfile'){[...x.files].forEach(f=>{if(d.files.length<MAX_PHOTOS){d.files.push(f);d.urls.push(URL.createObjectURL(f))}});d.blobs=null;d.result=null;d.err='';x.value='';render(true)}
  else if(x.id==='labfile'){const fs=[...x.files];x.value='';if(fs.length)extractLabs(fs)}
  else if(x.id==='d-date'){d.date=x.value||todayKey()}
  else if(x.dataset.rdate!=null&&x.value){const rid=x.dataset.rdate,nd=x.value;const p=S.pf;p.labs=p.labs.map(withPoints).map(l=>{l.points.forEach(q=>{if(q.rid===rid)q.date=nd});return sortPts(l)});const r=(p.reports||[]).find(r=>r.id===rid);if(r)r.date=nd;if(p.trend)p.trend.stale=true;S.pfDirty=true;saveProfile(true)}
  else if(x.tagName==='SELECT'){if(x.dataset.pb!=null)S.pf.basics[x.dataset.pb]=x.value;else if(x.dataset.lab!=null)S.pf.labs[+x.dataset.lab][x.dataset.f]=x.value;S.pfDirty=true}
});
boot();
</script>
</body>
</html>
